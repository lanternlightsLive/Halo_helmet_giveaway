<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Twitch Giveaway Winner Picker</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
  margin:0;
  padding:28px;
}

.wrap{
  max-width:850px;
  margin:auto;
}

.card{
  background:#1d1d1d;
  border:1px solid #333;
  border-radius:14px;
  padding:22px;
  margin:18px 0;
  box-shadow:0 5px 25px rgba(0,0,0,.35);
}

h1{
  margin:0 0 8px;
  text-align:center;
}

.sub,
.small{
  color:#aaa;
}

.sub{
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

input,
select,
button{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border-radius:8px;
  font-size:16px;
}

input,
select{
  background:#111;
  color:#fff;
  border:1px solid #555;
}

button{
  background:#6c35de;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
  margin-top:18px;
  transition:.2s;
}

button:hover{
  background:#824cff;
  transform:scale(1.01);
}

button:disabled{
  background:#444;
  cursor:not-allowed;
  transform:none;
}

.hidden{
  display:none;
}

.stats{
  text-align:center;
  color:#bbb;
  margin-top:12px;
}

.error{
  color:#ff7777;
  margin-top:10px;
  text-align:center;
}

/* Prize image */

.prize-image{
  display:block;
  width:300px;
  height:220px;
  object-fit:contain;
  margin:15px auto 25px;
  border-radius:12px;
}

/* Winner display */

.winner{
  text-align:center;
  font-size:42px;
  font-weight:bold;
  background:#090909;
  border:2px solid #6c35de;
  border-radius:12px;
  padding:35px 10px;
  min-height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-wrap:anywhere;
}

/* Countdown */

#winner.countdown{
  font-size:90px;
  color:#824cff;
  text-shadow:
    0 0 10px #6c35de,
    0 0 25px #6c35de,
    0 0 50px #6c35de;

  animation:pulse .8s ease-in-out infinite alternate;
}

@keyframes pulse{
  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.08);
  }
}

/* Winner reveal */

#winner.reveal{
  animation:reveal .7s ease-out;
}

@keyframes reveal{
  0%{
    transform:scale(.5);
    opacity:0;
  }

  60%{
    transform:scale(1.12);
    opacity:1;
  }

  100%{
    transform:scale(1);
  }
}

/* Mobile */

@media(max-width:650px){

  body{
    padding:15px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .winner{
    font-size:30px;
  }

  #winner.countdown{
    font-size:70px;
  }

  .prize-image{
    width:100%;
    max-width:300px;
    height:200px;
  }
}

</style>
</head>

<body>

<div class="wrap">

  <h1>🎁 Halo Helmet Giveaway</h1>

  <p class="sub">
    Weighted random winner picker
  </p>


  <!-- Excel Status -->

  <div class="card">

    <b>Giveaway Entries</b>

    <p id="status" class="small">
      Loading entries.xlsx...
    </p>

  </div>


  <!-- Controls -->

  <div id="controls" class="card hidden">

    <div class="grid">

      <div>
        <b>Viewer name column</b>
        <br><br>
        <select id="nameCol"></select>
      </div>

      <div>
        <b>Number of entries column</b>
        <br><br>
        <select id="entryCol"></select>
      </div>

    </div>


    <div id="stats" class="stats"></div>

    <p class="small">
      Every individual entry has an equal chance.
      A viewer with 64 entries has 64 chances;
      a viewer with 1 entry has 1 chance.
    </p>


    <button id="draw">
      🎲 DRAW WINNER
    </button>

    <div id="error" class="error"></div>

  </div>


  <!-- Winner Result -->

  <div id="result" class="card hidden">

    <div class="small" style="text-align:center">
      HALO HELMET GIVEAWAY
    </div>

    <img
      src="halo-helmet.jpg"
      alt="Halo Helmet Giveaway"
      class="prize-image"
    >

    <div class="small" style="text-align:center">
      WINNER
    </div>

    <div id="winner" class="winner">
      —
    </div>

    <div id="winnerInfo" class="stats"></div>

  </div>

</div>


<!-- Sounds -->

<audio
  id="countdownSound"
  src="countdown.mp3"
  preload="auto">
</audio>

<audio
  id="winnerSound"
  src="winner.mp3"
  preload="auto">
</audio>


<!-- Excel library -->

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


<script>

let rows = [];

const controls =
  document.getElementById('controls');

const nameCol =
  document.getElementById('nameCol');

const entryCol =
  document.getElementById('entryCol');

const stats =
  document.getElementById('stats');

const error =
  document.getElementById('error');

const status =
  document.getElementById('status');

const drawButton =
  document.getElementById('draw');

const winnerBox =
  document.getElementById('winner');

const result =
  document.getElementById('result');

const countdownSound =
  document.getElementById('countdownSound');

const winnerSound =
  document.getElementById('winnerSound');


/* =========================================
   LOAD EXCEL FILE AUTOMATICALLY
   ========================================= */

async function loadExcel(){

  try{

    const response =
      await fetch('entries.xlsx');

    if(!response.ok){

      throw new Error(
        'Could not find entries.xlsx'
      );

    }

    const data =
      await response.arrayBuffer();

    const wb =
      XLSX.read(
        data,
        {type:'array'}
      );

    const ws =
      wb.Sheets[
        wb.SheetNames[0]
      ];

    rows =
      XLSX.utils.sheet_to_json(
        ws,
        {defval:''}
      );

    if(!rows.length){

      throw new Error(
        'No data rows found.'
      );

    }


    /* Get column names */

    const headers =
      Object.keys(rows[0]);


    nameCol.innerHTML = '';
    entryCol.innerHTML = '';


    headers.forEach(h => {

      nameCol.add(
        new Option(h,h)
      );

      entryCol.add(
        new Option(h,h)
      );

    });


    /* Try to automatically find
       the correct columns */

    const low =
      headers.map(
        h => h.toLowerCase()
      );


    const nameIndex =
      low.findIndex(
        h =>
          /viewer|name|user|twitch/
          .test(h)
      );


    const entryIndex =
      low.findIndex(
        h =>
          /entry|entries|number/
          .test(h)
      );


    if(nameIndex >= 0){

      nameCol.selectedIndex =
        nameIndex;

    }


    if(entryIndex >= 0){

      entryCol.selectedIndex =
        entryIndex;

    }


    updateStats();

    controls.classList.remove(
      'hidden'
    );


    status.textContent =
      rows.length +
      ' viewer rows loaded from entries.xlsx';


  }catch(err){

    status.textContent =
      'Could not load entries.xlsx: ' +
      err.message;

  }

}


/* =========================================
   GET VIEWER DATA
   ========================================= */

function getData(){

  const n =
    nameCol.value;

  const e =
    entryCol.value;


  return rows

    .map(r => ({

      name:
        String(
          r[n] ?? ''
        ).trim(),

      entries:
        Number(
          String(
            r[e] ?? ''
          ).replace(/,/g,'')
        ) || 0

    }))

    .filter(
      x =>
        x.name &&
        x.entries > 0
    );

}


/* =========================================
   UPDATE STATS
   ========================================= */

function updateStats(){

  const d =
    getData();

  const total =
    d.reduce(
      (s,x) =>
        s + x.entries,
      0
    );


  stats.textContent =
    d.length +
    ' viewers • ' +
    total.toLocaleString() +
    ' total entries';

}


/* =========================================
   UPDATE WHEN COLUMNS CHANGE
   ========================================= */

nameCol.addEventListener(
  'change',
  updateStats
);

entryCol.addEventListener(
  'change',
  updateStats
);


/* =========================================
   SECURE RANDOM NUMBER
   ========================================= */

function randomInt(max){

  const limit =
    Math.floor(
      4294967296 / max
    ) * max;

  const a =
    new Uint32Array(1);


  do{

    crypto.getRandomValues(a);

  }while(
    a[0] >= limit
  );


  return a[0] % max;

}


/* =========================================
   WAIT FUNCTION
   ========================================= */

function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =========================================
   DRAW WINNER
   ========================================= */

drawButton.addEventListener(
  'click',
  async () => {

    error.textContent = '';


    const d =
      getData();


    const total =
      d.reduce(
        (s,x) =>
          s + x.entries,
        0
      );


    if(!d.length || !total){

      error.textContent =
        'No valid viewers/entries found. Check the columns.';

      return;

    }


    /* Prevent multiple clicks */

    drawButton.disabled = true;

    drawButton.textContent =
      '🎲 DRAWING...';


    /* Show result */

    result.classList.remove(
      'hidden'
    );


    /* Reset winner */

    winnerBox.classList.remove(
      'reveal'
    );

    winnerBox.classList.add(
      'countdown'
    );


    /*
      Start suspense sound
    */

    countdownSound.currentTime = 0;

    countdownSound.play()
      .catch(() => {});


    /*
      COUNTDOWN
    */

    winnerBox.textContent = '3';

    await wait(1000);


    winnerBox.textContent = '2';

    await wait(1000);


    winnerBox.textContent = '1';

    await wait(1000);


    /*
      Select winner AFTER countdown
    */

    const winning =
      randomInt(total) + 1;


    let sum = 0;

    let winner;


    for(const p of d){

      sum += p.entries;


      if(winning <= sum){

        winner = p;

        break;

      }

    }


    /*
      Stop countdown sound
    */

    countdownSound.pause();

    countdownSound.currentTime = 0;


    /*
      Change countdown to winner
    */

    winnerBox.classList.remove(
      'countdown'
    );

    winnerBox.classList.add(
      'reveal'
    );


    winnerBox.textContent =
      winner.name;


    /*
      Winner information
    */

    document.getElementById(
      'winnerInfo'
    ).textContent =

      'Winning entry #' +
      winning.toLocaleString() +

      ' of ' +
      total.toLocaleString() +

      ' • ' +
      winner.entries +
      ' entries';


    /*
      Play victory sound
    */

    winnerSound.currentTime = 0;

    winnerSound.play()
      .catch(() => {});


    /*
      Allow another draw
    */

    drawButton.disabled = false;

    drawButton.textContent =
      '🎲 DRAW WINNER';

  }
);


/* =========================================
   START
   ========================================= */

loadExcel();

</script>

</body>
</html>
